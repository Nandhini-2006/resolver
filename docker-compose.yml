version: '3.8'

services:
  backend:
    build: ./backend
    container_name: aws-resolver-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: aws-resolver-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Browser runs on the host, so it accesses the backend via localhost
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
